name: tmp copy GHCR_ORG_PAT to org fork
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-24.04
    steps:
      - name: Copy GHCR_ORG_PAT secret to developing-today/fleet
        env:
          GH_TOKEN: ${{ secrets.GHCR_ORG_PAT }}
        run: |
          printf '%s' "$GH_TOKEN" | gh secret set GHCR_ORG_PAT --repo developing-today/fleet
          echo "target secrets after copy:"
          gh secret list --repo developing-today/fleet
