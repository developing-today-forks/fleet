name: dns probe (temporary diagnostic)

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve from the host runner
        run: |
          echo "--- getent ---"; getent hosts nix-cache.developing-today-llc-domains-0.workers.dev || true
          echo "--- resolv.conf ---"; cat /etc/resolv.conf || true
          echo "--- curl nix-cache-info ---"; curl -sI --max-time 15 https://nix-cache.developing-today-llc-domains-0.workers.dev/nix-cache-info | head -3 || true
          echo "--- control: workers.dev root zone ---"; getent hosts workers.dev || true
          echo "--- control: another workers.dev name ---"; getent hosts example.workers.dev || true
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ghcr.io/dezren39/fleet-build:base
      options: --user root
    steps:
      - name: Resolve from inside the fleet-build container
        run: |
          echo "--- getent ---"; getent hosts nix-cache.developing-today-llc-domains-0.workers.dev || true
          echo "--- resolv.conf ---"; cat /etc/resolv.conf || true
          echo "--- curl nix-cache-info ---"; curl -sI --max-time 15 https://nix-cache.developing-today-llc-domains-0.workers.dev/nix-cache-info | head -3 || true
          echo "--- nix download attempt ---"; nix store info --store https://nix-cache.developing-today-llc-domains-0.workers.dev 2>&1 | head -3 || true
